<div class="container mt-4">
    <p class="route-url">Iron-Revolution-Center / Membresías</p>
    <div class="container-main-membresias">
      <p class="title-page"><mat-icon class="icon">calendar_today</mat-icon>Membresías</p>
  
      <!-- Botón Agregar -->
      <button mat-raised-button color="success" (click)="openAddMembershipModal()">
        <mat-icon>add</mat-icon> Agregar
      </button>
  
      <!-- Modal para agregar nueva membresía -->
      <div *ngIf="isAddMembershipModalOpen" class="modal-overlay">
        <div class="modal-content">
          <h2>Agregar nueva membresía</h2>
          <div class="modal-body">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" [(ngModel)]="newMembership.name" class="modal-input">
            
            <label for="duracion">Duración</label>
            <input id="duracion" type="number" [(ngModel)]="newMembership.duration" class="modal-input">
          </div>
          <div class="modal-actions">
            <button mat-button (click)="closeAddMembershipModal()">Cancelar</button>
            <button mat-button (click)="saveMembership()">Agregar</button>
          </div>
        </div>
      </div>
  
      <!-- Modal para editar membresía -->
<div *ngIf="isEditMembershipModalOpen" class="modal-overlay">
    <div class="modal-content">
      <h2>Modificar membresía</h2>
      <div class="modal-body">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" [(ngModel)]="editMembershipData.name" class="modal-input">
        
        <label for="duracion">Duración (días)</label>
        <input id="duracion" type="number" [(ngModel)]="editMembershipData.duration" class="modal-input">
      </div>
      <div class="modal-actions">
        <button mat-button (click)="closeEditMembershipModal()">Cancelar</button>
        <button mat-button (click)="updateMembership()">Guardar</button>
      </div>
    </div>
  </div>
  
      <!-- Modal para eliminar membresía -->
      <div *ngIf="isDeleteMembershipModalOpen" class="modal-overlay">
        <div class="modal-content">
          <h2>Eliminar membresía</h2>
          <div class="modal-body">
            <p>¿Desea eliminar la membresía?</p>
          </div>
          <div class="modal-actions">
            <button mat-button (click)="closeDeleteMembershipModal()">Cancelar</button>
            <button mat-button (click)="confirmDelete()">Confirmar</button>
          </div>
        </div>
      </div>
  
      <!-- Tabla de membresías -->
      <table mat-table [dataSource]="filteredMemberships" class="mat-elevation-z8">
        <!-- Columna Nombre -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Nombre </th>
          <td mat-cell *matCellDef="let membership"> {{membership.name}} </td>
        </ng-container>
  
        <!-- Columna Duración -->
        <ng-container matColumnDef="duration">
          <th mat-header-cell *matHeaderCellDef> Duración</th>
          <td mat-cell *matCellDef="let membership"> {{membership.duration}} </td>
        </ng-container>
  
        <!-- Columna Acciones -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let membership">
            <button mat-icon-button color="warn" (click)="editMembership(membership)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="accent" (click)="deleteMembership(membership)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <!-- Encabezados y Filas -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <br>
    </div>
  </div>
