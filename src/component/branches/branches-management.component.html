<div class="container mt-4">
  <p class="route-url">Iron-Revolution-Center / Sucursales</p>
  <div class="container-main-sucursales">
      <p class="title-page"><mat-icon class="icon">home</mat-icon>Sucursales</p>

  <!-- Barra de búsqueda y filtros -->
  <div class="filter"> 
    <div class="select-branch">
        <input class="search-input" type="text" placeholder="Buscar" [(ngModel)]="searchQuery" (input)="applyFilter()">
    </div>
    <button class="clean-btn" (click)="clear()">
        <mat-icon class="cleaning-service-icon">cleaning_services</mat-icon>
        Limpiar
    </button>
    <mat-icon class="filter-icon">tune</mat-icon>
  </div>

  <!-- Botón Agregar -->
  <button mat-raised-button color="success" (click)="openAddBranchModal()">
    <mat-icon>add</mat-icon> Agregar
  </button>

  <!-- Modal para agregar nueva sucursal -->
<div *ngIf="isAddBranchModalOpen" class="modal-overlay">
  <div class="modal-content">
    <h2>Agregar nueva sucursal</h2>
    <div class="modal-body">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" [(ngModel)]="newBranch.name" class="modal-input">
      
      <label for="ubicacion">Ubicación</label>
      <input id="ubicacion" type="text" [(ngModel)]="newBranch.location" class="modal-input">
    </div>
    <div class="modal-actions">
      <button mat-button (click)="closeAddBranchModal()">Cancelar</button>
      <button mat-button (click)="saveBranch()">Agregar</button>
    </div>
  </div>
</div>

<!-- Modal para editar sucursal -->
<div *ngIf="isEditBranchModalOpen" class="modal-overlay">
  <div class="modal-content">
    <h2>Modificar sucursal</h2>
    <div class="modal-body">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" [(ngModel)]="editBranchData.name" class="modal-input">
      
      <label for="ubicacion">Ubicación</label>
      <input id="ubicacion" type="text" [(ngModel)]="editBranchData.location" class="modal-input">
    </div>
    <div class="modal-actions">
      <button mat-button (click)="closeEditBranchModal()">Cancelar</button>
      <button mat-button (click)="updateBranch()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal para eliminar sucursal -->
<div *ngIf="isDeleteBranchModalOpen" class="modal-overlay">
  <div class="modal-content">
    <h2>Eliminar sucursal</h2>
    <div class="modal-body">
      <p>¿Desea eliminar la sucursal?</p>
    </div>
    <div class="modal-actions">
      <button mat-button (click)="closeDeleteBranchModal()">Cancelar</button>
      <button mat-button (click)="confirmDelete()">Confirmar</button>
    </div>
  </div>
</div>

  <!-- Tabla de sucursales -->
  <table mat-table [dataSource]="filteredBranches" class="mat-elevation-z8">
    <!-- Columna NIP -->
    <ng-container matColumnDef="nip">
      <th mat-header-cell *matHeaderCellDef> NIP </th>
      <td mat-cell *matCellDef="let branch"> {{branch.nip}} </td>
    </ng-container>

    <!-- Columna Nombre -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let branch"> {{branch.name}} </td>
    </ng-container>

    <!-- Columna Ubicación -->
    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef> Ubicación </th>
      <td mat-cell *matCellDef="let branch"> {{branch.location}} </td>
    </ng-container>

    <!-- Columna Acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let branch">
        <button mat-icon-button color="warn" (click)="editBranch(branch)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="accent" (click)="deleteBranch(branch)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Encabezados y Filas -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <br>
